name: Sphinx docs to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      preview:
        description: Build a downloadable PR preview instead of deploying to Pages
        required: true
        default: false
        type: boolean
      pr_number:
        description: Pull request number for the preview
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check preview input
        if: github.event_name == 'workflow_dispatch' && inputs.preview && !inputs.pr_number
        run: |
          echo 'pr_number is required for a preview.'
          exit 1

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'release' && github.ref || (inputs.preview && format('refs/pull/{0}/merge', inputs.pr_number) || 'main') }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@8ca4608ef7f4daeb54f5205b20d0b7cb42f11143 # v0.8.14
        with:
          pixi-version: 0.84.1
          environments: default

      - name: Build the docs
        run: |
          pixi run docs-clean
          pixi run docs-apidocs
          pixi run docs-html

      - name: Upload Pages artifact
        if: github.event_name == 'release' || !inputs.preview
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/build/html

      - name: Upload preview artifact
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview-${{ github.run_id }}
          path: docs/build/html
          retention-days: 14

  deploy:
    name: Deploy documentation to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'release' && github.event.release.target_commitish == 'main') ||
      (github.event_name == 'workflow_dispatch' && !inputs.preview)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
