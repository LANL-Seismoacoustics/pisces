name: Install and Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[no CI]')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { environment: py311, os: ubuntu-latest }
          - { environment: py312, os: ubuntu-latest }
          - { environment: py313, os: ubuntu-latest }
          - { environment: py314, os: ubuntu-latest }
          - { environment: py311, os: macos-latest }
          - { environment: py314, os: macos-latest }
          - { environment: py311, os: windows-latest }
          - { environment: py314, os: windows-latest }

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e #v0.11.3
      with:
        environments: ${{ matrix.environment }}
    - name: Test with pytest
      run: pixi run -e ${{ matrix.environment }} pytest -v
