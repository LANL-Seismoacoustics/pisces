[workspace]
authors = ["Jonathan MacCarthy <jkmacc@lanl.gov>"]
channels = ["conda-forge"]
name = "pisces"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
docs-clean = { cmd = "sphinx-build -M clean source build", cwd = "docs" }
docs-apidocs = { cwd = "docs", cmd = '''
rm -rf source/apidocs
sphinx-apidoc -d 2 -Mef -t templates -o source/apidocs ../pisces
cat source/_cli.rst >> source/apidocs/pisces.commands.rst
''' }
docs-html = { cmd = "sphinx-build -M html source build", cwd = "docs" }
docs-serve = { cmd = "sphinx-autobuild source build", cwd = "docs" }

[dependencies]
python = ">=3.11"
obspy = ">=1.4.1"
sqlalchemy = ">=2"
click = ">=8.5.0,<9"
oracledb = ">=26.0.1,<27"

[feature.dev.dependencies]
myst-parser = ">=5.1.0,<6"
pydata-sphinx-theme = ">=0.23.0,<0.24"
sphinx = ">=7.0.0,<9"
sphinx-book-theme = ">=1.1.3,<2"
sphinx-click = ">=6.2.0,<7"
numpydoc = ">=1.11.0,<2"
e1 = ">=0.2.1,<0.3"
sphinx-autobuild = ">=2025.8.25,<2026"
ipython = ">=9.17.1,<10"
pytest = ">=9.1.1,<10"

[feature.dev.pypi-dependencies]
pisces = { path = ".", editable = true }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
dev = ["dev"]
py311 = ["dev", "py311"]
py312 = ["dev", "py312"]
py313 = ["dev", "py313"]
py314 = ["dev", "py314"]
